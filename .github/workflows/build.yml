name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fp32_only:
        description: Run only the experimental RISC-V FP32 tests
        type: boolean
        default: false

jobs:
  versions:
    if: ${{ !inputs.fp32_only }}
    uses: ./.github/workflows/ocaml-versions.yml
  compcert:
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.images_matrix) }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      env:
        OCAML_VERSION: ${{ matrix.ocaml_version }}
      with:
        variant: ${{ matrix.ocaml_version }}
        platform: ${{ matrix.platform }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: info
      run: |
        ${{ env.EXEC }} sh -c 'uname -m && opam exec -- rocq --version'
    - name: configure
      run: |
        ${{ env.EXEC }} make compcert-configure
    - name: build
      run: |
        ${{ env.EXEC }} make compcert-build
    - name: check-proof
      run: |
        ${{ env.EXEC }} make compcert-check-proof
    - name: test
      run: |
        ${{ env.EXEC }} make compcert-test
    - name: cross-smoke
      run: |
        ${{ env.EXEC }} tools/compcert-cross-smoke.sh
    - name: cross-smoke tri-state
      if: matrix.platform == 'linux/amd64' && matrix.ocaml_version == '5.5.0'
      run: |
        ${{ env.EXEC }} make compcert-cross-smoke-selftest
    - name: cross-smoke artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cross-smoke-${{ matrix.ocaml_version }}-${{ strategy.job-index }}
        path: .cross-smoke-work/artifacts
        retention-days: 7
        if-no-files-found: ignore

  riscv-fp32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    env:
      OCAML_VERSION: 4.14.3
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      with:
        variant: ${{ env.OCAML_VERSION }}
    - name: FP32 build, proofs and D-disabled execution
      run: ${{ steps.devcontainer.outputs.exec }} make compcert-fp32-test RISCV_BITS=${{ matrix.bits }}
    - name: FP32 evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: riscv-fp32-${{ matrix.bits }}
        path: |
          .fp32-work/rv${{ matrix.bits }}/*.s
          .fp32-work/rv${{ matrix.bits }}/*.c
          .fp32-work/rv${{ matrix.bits }}/*.log
          .fp32-work/rv${{ matrix.bits }}/*.dis
          .fp32-work/rv${{ matrix.bits }}/*.elf
          .fp32-work/rv${{ matrix.bits }}/*.ini
          .fp32-work/rv${{ matrix.bits }}/upstream/*.tsv
          .fp32-work/rv${{ matrix.bits }}/upstream/metadata.txt
          .fp32-work/rv${{ matrix.bits }}/upstream/evidence/**/*.log
          .fp32-work/rv${{ matrix.bits }}/upstream/evidence/**/*.elf
          .fp32-work/rv${{ matrix.bits }}/upstream/test/**
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.s
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.c
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.log
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.elf
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.tsv
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.ini
          .fp32-work/rv${{ matrix.bits }}/calls/**/elf-attributes.txt
          .fp32-work/rv${{ matrix.bits }}/calls/**/metadata.txt
          .fp32-work/rv${{ matrix.bits }}/calls/fixtures/**
          .fp32-work/rv${{ matrix.bits }}/calls/varargs/fixtures/**
          .fp32-work/rv${{ matrix.bits }}/calls/**/*.dis
          .fp32-work/rv${{ matrix.bits }}/calls/upstream/test/**
        retention-days: 7
        if-no-files-found: ignore

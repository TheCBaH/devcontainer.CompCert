name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Matches the published devcontainer image this reuses for build caching -
# see the comment in compcert-split.yml.
env:
  OCAML_VERSION: 4.14.3

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: ${{ env.OCAML_VERSION }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    # Builds and verifies one export archive per CompCert target (x86_32,
    # x86_64, arm, aarch64) - see tools/compcert-export-archive-all.sh for
    # why a single archive can't cover all 4.
    - name: export-archive
      run: |
        ${{ env.EXEC }} tools/compcert-export-archive-all.sh
    - name: publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          compcert-export-x86_32.tar.gz \
          compcert-export-x86_64.tar.gz \
          compcert-export-arm.tar.gz \
          compcert-export-aarch64.tar.gz \
          --title "${{ github.ref_name }}" \
          --generate-notes

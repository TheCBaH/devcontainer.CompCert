name: release

# A v<compcert-version>-<n> tag publishes every artifacts.yml target: tarballs,
# SHA256SUMS and artifacts.json. A -rc tag is marked as a prerelease.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  artifacts:
    uses: ./.github/workflows/artifacts.yml

  release:
    needs: artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: download-artifact
      uses: actions/download-artifact@v8
      with:
        name: compcert-artifacts
        path: dist
    - name: check
      run: |
        cd dist
        sha256sum -c SHA256SUMS
        expected=$((3 * $(jq '.targets | length' artifacts.json) + 2))
        test "$(ls | wc -l)" -eq "$expected"
    - name: publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        case "${{ github.ref_name }}" in *-rc*) pre=--prerelease ;; *) pre= ;; esac
        gh release create "${{ github.ref_name }}" dist/* $pre \
          --title "${{ github.ref_name }}" \
          --generate-notes
